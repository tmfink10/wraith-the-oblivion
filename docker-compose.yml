services:
  wraith:
    build: .
    ports:
      - "3001:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATABASE_PATH=/app/data/wraith.db
    volumes:
      - wraith-data:/app/data
    restart: unless-stopped

volumes:
  wraith-data:
